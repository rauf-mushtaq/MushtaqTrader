name: Update market data

on:
  schedule:
    # Every 30 min while the UK and US markets are open (UTC, Mon-Fri)
    - cron: "7,37 7-21 * * 1-5"
    # Crypto trades all weekend: every 2 hours on Sat/Sun
    - cron: "17 */2 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_market_data.py"
      - ".github/workflows/update-market-data.yml"

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch real market and economic data
        run: python scripts/fetch_market_data.py
        env:
          # Optional free API keys (repo Settings -> Secrets and variables -> Actions).
          # With them, analyst targets, financial health, earnings dates and retail
          # sales in data/fundamentals.json refresh once a day.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
