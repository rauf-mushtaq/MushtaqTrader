name: Update market data

# GitHub's built-in scheduler is "best effort" and often skips runs, so this job
# keeps itself going around the clock: while markets are open each run refreshes
# the data three times (about every 15 minutes), otherwise once an hour, and then
# starts the next run. The schedules below are only a backup to (re)start the
# chain if it ever stops.

on:
  schedule:
    # Backup starts while the UK and US markets are open (UTC, Mon-Fri)
    - cron: "7 7-21 * * 1-5"
    # Crypto trades all weekend: every 2 hours on Sat/Sun
    - cron: "17 */2 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_market_data.py"
      - ".github/workflows/update-market-data.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data (repeats every ~15 minutes while markets are open)
        env:
          # Optional free API keys (repo Settings -> Secrets and variables -> Actions).
          # With them, analyst targets, financial health, earnings dates and retail
          # sales in data/fundamentals.json refresh once a day.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          market_open() {  # Mon-Fri, 07:00-21:45 UTC (London open to just after New York close)
            [ "$(date -u +%u)" -le 5 ] && [ "$(date -u +%H%M)" -ge 0700 ] && [ "$(date -u +%H%M)" -le 2145 ]
          }
          for i in 1 2 3; do
            python scripts/fetch_market_data.py || echo "Fetch reported a problem; keeping previous data where needed"
            git add data/*.json
            if git diff --cached --quiet; then
              echo "No changes"
            else
              git commit -q -m "Update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
              for try in 1 2 3 4; do
                git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
                sleep $((try * 5))
              done
            fi
            if [ "$i" -lt 3 ] && market_open; then sleep 780; else break; fi
          done
          # Outside market hours refresh about once an hour (crypto and Asia keep moving)
          if ! market_open; then sleep 3000; fi

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the chain going around the clock so it never depends on GitHub's
          # scheduler to restart it in the morning (that scheduler often skips runs)
          gh workflow run update-market-data.yml --ref "${GITHUB_REF_NAME}" && echo "Next run started"
